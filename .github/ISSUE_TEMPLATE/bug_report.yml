name: Bug report (问题反馈)
description: Something on the site is broken or looks wrong (网站上有东西坏了或显示不对)
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened? (遇到了什么问题)
      description: What you did, what you saw, and what you expected instead. (你做了什么、看到了什么、本来应该是什么样)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device (浏览器和设备)
      placeholder: Chrome 150 on macOS / Safari on iPhone 17
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or link (截图或链接)
      description: Optional. A link with `#hero` and the search you typed helps a lot. (可选，附上页面链接和你搜的词会很有帮助)
